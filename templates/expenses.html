{% extends "base.html" %}

{% block title %}Expenses - Expense Tracker{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="fas fa-money-bill-wave"></i> Expenses</h2>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addExpenseModal">
            <i class="fas fa-plus"></i> Add Expense
        </button>
    </div>
    
    <!-- Filter Section -->
    <div class="card mb-4">
        <div class="card-body">
            <div class="row">
                <div class="col-md-3">
                    <label>Category</label>
                    <select id="filterCategory" class="form-select">
                        <option value="">All Categories</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label>Start Date</label>
                    <input type="date" id="filterStartDate" class="form-control" onchange="updateEndDateMin()">
                </div>
                <div class="col-md-2">
                    <label>End Date</label>
                    <input type="date" id="filterEndDate" class="form-control" onchange="updateStartDateMax()">
                </div>
                <div class="col-md-2">
                    <label>&nbsp;</label>
                    <button class="btn btn-primary w-100" onclick="loadExpenses()">
                        <i class="fas fa-filter"></i> Filter
                    </button>
                </div>
                <div class="col-md-2">
                    <label>&nbsp;</label>
                    <button class="btn btn-secondary w-100" onclick="clearExpenseFilters()">
                        <i class="fas fa-times"></i> Clear
                    </button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Expenses Table -->
    <div class="card">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead class="table-dark">
                        <tr>
                            <th>Date</th>
                            <th>Category</th>
                            <th>Description</th>
                            <th>Amount</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="expensesTable"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Add Expense Modal -->
<div class="modal fade" id="addExpenseModal">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Add Expense</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form id="addExpenseForm">
                <div class="modal-body">
                    <div class="mb-3">
                        <label>Category *</label>
                        <select id="expenseCategory" class="form-select" required></select>
                    </div>
                    <div class="mb-3">
                        <label>Amount *</label>
                        <input type="number" id="expenseAmount" class="form-control" step="0.01" required>
                    </div>
                    <div class="mb-3">
                        <label>Date *</label>
                        <input type="date" id="expenseDate" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label>Description</label>
                        <textarea id="expenseDescription" class="form-control" rows="3"></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Edit Expense Modal -->
<div class="modal fade" id="editExpenseModal">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Edit Expense</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form id="editExpenseForm">
                <div class="modal-body">
                    <input type="hidden" id="editExpenseId">
                    <div class="mb-3">
                        <label>Category *</label>
                        <select id="editExpenseCategory" class="form-select" required></select>
                    </div>
                    <div class="mb-3">
                        <label>Amount *</label>
                        <input type="number" id="editExpenseAmount" class="form-control" step="0.01" required>
                    </div>
                    <div class="mb-3">
                        <label>Date *</label>
                        <input type="date" id="editExpenseDate" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label>Description</label>
                        <textarea id="editExpenseDescription" class="form-control" rows="3"></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Update</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
let categories = [];
let allExpenses = []; // Cache all expenses

async function loadCategories() {
    try {
        const response = await apiRequest(`${API_URL}/api/categories`);
        if (!response) {
            console.error('No response from categories API');
            return;
        }
        
        if (!response.ok) {
            console.error('Categories API error:', response.status, response.statusText);
            const errorData = await response.text();
            console.error('Error details:', errorData);
            return;
        }
        
        const data = await response.json();
        console.log('Categories received:', data);
        
        categories = data.filter(c => c.category_type === 'expense');
        console.log('Expense categories filtered:', categories);
        
        if (categories.length === 0) {
            console.warn('No expense categories found!');
            document.getElementById('expenseCategory').innerHTML = '<option value="">No categories available</option>';
            return;
        }
        
        const options = categories.map(c => `<option value="${c.id}">${c.category_name}</option>`).join('');
        document.getElementById('expenseCategory').innerHTML = options;
        document.getElementById('editExpenseCategory').innerHTML = options;
        document.getElementById('filterCategory').innerHTML = '<option value="">All Categories</option>' + options;
        
        console.log('Categories loaded successfully:', categories.length);
    } catch (error) {
        console.error('Error loading categories:', error);
    }
}

async function loadExpenses(refresh = false) {
    // Only fetch from API if refresh is true or data not loaded
    if (refresh || allExpenses.length === 0) {
        const response = await apiRequest(`${API_URL}/api/expenses/user`);
        if (!response) return;
        allExpenses = await response.json();
    }
    
    const category = document.getElementById('filterCategory').value;
    const startDate = document.getElementById('filterStartDate').value;
    const endDate = document.getElementById('filterEndDate').value;
    
    // Client-side filtering
    let expenses = [...allExpenses];
    if (category) expenses = expenses.filter(e => e.category_id == category);
    if (startDate) expenses = expenses.filter(e => e.date >= startDate);
    if (endDate) expenses = expenses.filter(e => e.date <= endDate);
    
    const html = expenses.map(exp => {
        const cat = categories.find(c => c.id === exp.category_id);
        return `
            <tr>
                <td>${exp.date}</td>
                <td>${cat ? cat.category_name : 'Unknown'}</td>
                <td>${exp.description || '-'}</td>
                <td>₹${exp.amount.toFixed(2)}</td>
                <td>
                    <button class="btn btn-sm btn-primary me-1" onclick='editExpense(${JSON.stringify(exp).replace(/'/g, "&apos;")})'>
                        <i class="fas fa-edit"></i>
                    </button>
                    <button class="btn btn-sm btn-danger" onclick="deleteExpense(${exp.id})">
                        <i class="fas fa-trash"></i>
                    </button>
                </td>
            </tr>
        `;
    }).join('');
    
    document.getElementById('expensesTable').innerHTML = html || '<tr><td colspan="5" class="text-center">No expenses found</td></tr>';
}

function clearExpenseFilters() {
    document.getElementById('filterCategory').value = '';
    document.getElementById('filterStartDate').value = '';
    document.getElementById('filterStartDate').removeAttribute('max');
    document.getElementById('filterEndDate').value = '';
    document.getElementById('filterEndDate').removeAttribute('min');
    loadExpenses();
}

function updateEndDateMin() {
    const startDate = document.getElementById('filterStartDate').value;
    const endDateInput = document.getElementById('filterEndDate');
    if (startDate) {
        endDateInput.min = startDate;
        // If end date is already set and less than start date, clear it
        if (endDateInput.value && endDateInput.value < startDate) {
            endDateInput.value = '';
        }
    } else {
        endDateInput.removeAttribute('min');
    }
}

function updateStartDateMax() {
    const endDate = document.getElementById('filterEndDate').value;
    const startDateInput = document.getElementById('filterStartDate');
    if (endDate) {
        startDateInput.max = endDate;
        // If start date is already set and greater than end date, clear it
        if (startDateInput.value && startDateInput.value > endDate) {
            startDateInput.value = '';
        }
    } else {
        startDateInput.removeAttribute('max');
    }
}

document.getElementById('addExpenseForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const expense = {
        category_id: parseInt(document.getElementById('expenseCategory').value),
        amount: parseFloat(document.getElementById('expenseAmount').value),
        date: document.getElementById('expenseDate').value,
        description: document.getElementById('expenseDescription').value
    };
    
    const response = await apiRequest(`${API_URL}/api/expenses`, {
        method: 'POST',
        body: JSON.stringify(expense)
    });
    
    if (response && response.ok) {
        bootstrap.Modal.getInstance(document.getElementById('addExpenseModal')).hide();
        showToast('Expense added successfully!', 'success');
        document.getElementById('addExpenseForm').reset();
        loadExpenses(true); // Refresh data from API
    } else {
        showToast('Failed to add expense', 'danger');
    }
});

function editExpense(expense) {
    document.getElementById('editExpenseId').value = expense.id;
    document.getElementById('editExpenseCategory').value = expense.category_id;
    document.getElementById('editExpenseAmount').value = expense.amount;
    document.getElementById('editExpenseDate').value = expense.date;
    document.getElementById('editExpenseDescription').value = expense.description || '';
    
    const modal = new bootstrap.Modal(document.getElementById('editExpenseModal'));
    modal.show();
}

document.getElementById('editExpenseForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const expense = {
        id: parseInt(document.getElementById('editExpenseId').value),
        category_id: parseInt(document.getElementById('editExpenseCategory').value),
        amount: parseFloat(document.getElementById('editExpenseAmount').value),
        date: document.getElementById('editExpenseDate').value,
        description: document.getElementById('editExpenseDescription').value
    };
    
    const response = await apiRequest(`${API_URL}/api/expenses/update`, {
        method: 'PUT',
        body: JSON.stringify(expense)
    });
    
    if (response && response.ok) {
        bootstrap.Modal.getInstance(document.getElementById('editExpenseModal')).hide();
        showToast('Expense updated successfully!', 'success');
        loadExpenses(true); // Refresh data from API
    } else {
        showToast('Failed to update expense', 'danger');
    }
});

async function deleteExpense(id) {
    if (!confirm('Are you sure you want to delete this expense?')) return;
    
    const response = await apiRequest(`${API_URL}/api/expenses/delete/${id}`, {
        method: 'DELETE'
    });
    
    if (response && response.ok) {
        showToast('Expense deleted successfully!', 'success');
        loadExpenses(true); // Refresh data from API
    } else {
        showToast('Failed to delete expense', 'danger');
    }
}

// Initialize
document.addEventListener('DOMContentLoaded', function() {
    loadCategories().then(() => loadExpenses());
    // Set today's date as default
    document.getElementById('expenseDate').valueAsDate = new Date();
});
</script>
{% endblock %}
